<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <img class="logo" src="images/logo.png" alt="Oldagram">
            <img class="user-avatar" src="images/user-avatar.png" alt="User profile">
        </header>

        <main>
            <article>
                <div class="user">
                    <img src="images/avatar-vangogh.jpg" alt="Vincent van Gogh">
                    <div class="user-info">
                        <p>Vincent van Gogh</p>
                        <p>Zundert, Netherlands</p>
                    </div>
                </div>

                <img class="post-image" src="images/post-vangogh.jpg" alt="Van Gogh self-portrait">

                <div class="actions">
                    <button aria-label="Like post">
                        <img src="images/icon-heart.png" alt="">
                    </button>

                    <button aria-label="Comment on post">
                        <img src="images/icon-comment.png" alt="">
                    </button>

                    <button aria-label="Share post">
                        <img src="images/icon-dm.png" alt="">
                    </button>
                </div>

                <p><strong>21,492 likes</strong></p>
                <p>
                    <strong>vincey1853</strong>
                    just took a few mushrooms lol
                </p>
            </article>
        </main>
        
        <script src="index.js"></script>
    </body>
</html>
